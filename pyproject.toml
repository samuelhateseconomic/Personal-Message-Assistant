[project]
name = "imsg-agent"
version = "0.1.0"
description = "AI-powered iMessage scheduler for macOS — 100% local, privacy-first"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4",
    "pydantic>=2.9",
    "typer>=0.12",
    "rich>=13.0",
    "dateparser>=1.2",
    "rapidfuzz>=3.9",
    "croniter>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
imsg = "imsg_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imsg_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
